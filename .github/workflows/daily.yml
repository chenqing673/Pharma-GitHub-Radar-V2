name: Pharma Radar Daily Update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== before run: working dir ==="
          pwd
          ls -la index.html DAILY_REPORT.md 2>/dev/null || echo "(files not present)"
          echo "=== running main.py ==="
          python main.py
          echo "=== exit: $? ==="
          echo "=== after run: file presence + size ==="
          ls -la index.html DAILY_REPORT.md

      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          echo "=== git status ==="
          git status --short
          git add .
          echo "=== staged changes ==="
          git diff --cached --stat
          if git diff-index --quiet --cached HEAD; then
            echo "=== no staged changes, skipping commit ==="
          else
            git commit -m "Daily radar update $(date -u +'%Y-%m-%d %H:%M UTC)'"
            git push
            echo "=== pushed ==="
          fi
