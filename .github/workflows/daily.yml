name: Pharma Radar Daily Update

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

# 串行执行：防止手动触发与定时任务同时跑导致 db 并发写 / push 冲突
concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== before run: working dir ==="
          pwd
          ls -la index.html DAILY_REPORT.md 2>/dev/null || echo "(files not present)"
          echo "=== running main.py ==="
          python main.py
          echo "=== exit: $? ==="
          echo "=== after run: file presence + size ==="
          ls -la index.html DAILY_REPORT.md

      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          if git diff --cached --quiet; then
            echo "no changes to commit, skipping"
          else
            git commit -m "Daily radar update"
            git push
            echo "pushed"
          fi
